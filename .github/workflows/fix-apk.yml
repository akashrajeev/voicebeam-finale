name: ENH7 raw-detection fix APK
on:
  push:
    branches: [fix/raw-detection-vision-timing]
    paths: ['.github/workflows/fix-apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch public models
        run: bash scripts/fetch_models.sh
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug -Dorg.gradle.jvmargs="-Xmx3g"
      - name: Private release asset (no Actions artifact)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/$GITHUB_REPOSITORY --jq .private | grep -qx true
          sha256sum app/build/outputs/apk/debug/app-debug.apk > APK-SHA256.txt
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as E
          roots=[E.parse(p).getroot() for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml')]
          tests=sum(int(r.attrib['tests']) for r in roots)
          failures=sum(int(r.attrib.get('failures','0'))+int(r.attrib.get('errors','0')) for r in roots)
          assert roots and failures==0
          open('TEST-SUMMARY.txt','w').write(f'{tests} JVM tests; {failures} failures/errors. Debug APK built. No phone test yet.\n')
          PY
          tag="enh7-fix-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          gh release create "$tag" app/build/outputs/apk/debug/app-debug.apk APK-SHA256.txt TEST-SUMMARY.txt --target "$GITHUB_SHA" --prerelease --title "ENH-7 raw detection fix (phone retest pending)" --notes "Private debug candidate from fix branch. JVM tests and APK build passed; live phone hearing, timing and earbuds retest required. Not merged to main. No new UI/settings."
