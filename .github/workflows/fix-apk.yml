name: enh-exp-ver6-extract validation and APK
# One approved branch build on this workflow edit; subsequent source builds require approval.
on:
  push:
    branches: [enh-exp-ver6-extract]
    paths: ['.github/workflows/fix-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch public models
        run: bash scripts/fetch_models.sh
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug -Dorg.gradle.jvmargs="-Xmx3g"
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual Android offline extractor and fallback test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            VB_EMULATOR=1 ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.akashrajeev.voicebeam.OfflineExtractorTest,com.akashrajeev.voicebeam.OfflineSessionsUiTest -Dorg.gradle.jvmargs="-Xmx3g"
            adb pull /sdcard/Android/data/com.akashrajeev.voicebeam.finale/files/offline-sessions-ui.png offline-sessions-ui.png
            adb logcat -d -s TseTest:I > offline-extractor-log.txt
      - name: Restore arm64 phone APK after x86 emulator validation
        run: ./gradlew --no-daemon assembleDebug -Dorg.gradle.jvmargs="-Xmx3g"
      - name: Report exact source metadata and tests
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, glob, xml.etree.ElementTree as E
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          config = pathlib.Path('app/build/generated/source/buildConfig/debug/com/akashrajeev/voicebeam/BuildConfig.java').read_text()
          assert 'LAB_COMMIT = "' + sha + '";' in config
          print('BuildConfig source commit verified: ' + sha)
          import zipfile,hashlib
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              model=apk.read('assets/models/dfn3-mobile.bin')
              assert model[:2]==b'\x1f\x8b'
              assert hashlib.sha256(model).hexdigest()=='5600b6857117ecc7cf460b8ec4841963bfa6d718921d424d42dea5d3d37a8c32'
              native=apk.read('lib/arm64-v8a/libdf.so')
              assert hashlib.sha256(native).hexdigest()=='0ec8bc3971bbb8a804b4b53910e8cad3626b9db6b4c44167eba9b669f58f0584'
              assert hashlib.sha256(apk.read('assets/models/speakerbeam-8k.onnx')).hexdigest()=='e9bdb6c0a8e51b8341435f49abe59ead136cd2b9d6b6c178990fdc50bf54c9eb'
              print('APK DFN gzip model, arm64 JNI and offline SpeakerBeam ONNX bytes verified')
          roots = [E.parse(p).getroot() for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml')]
          tests = sum(int(r.attrib['tests']) for r in roots)
          failures = sum(int(r.attrib.get('failures', '0')) + int(r.attrib.get('errors', '0')) for r in roots)
          assert roots and failures == 0
          print(f'{tests} JVM tests; {failures} failures/errors. Debug APK built. Phone test separate.')
          android_roots = [E.parse(p).getroot() for p in glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml',recursive=True)]
          assert android_roots and sum(int(r.attrib.get('failures','0'))+int(r.attrib.get('errors','0')) for r in android_roots)==0
          print('Android offline extractor tests: '+str(sum(int(r.attrib.get('tests','0')) for r in android_roots)))
          PY
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: enh-exp-ver6-extract-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            offline-sessions-ui.png
            offline-extractor-log.txt
          retention-days: 1
          if-no-files-found: error
