name: Footage delivery native gates - diagnostic phone denoise y
on:
  push:
    branches: [experiment-12]
    paths: ['.github/workflows/footage-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch pinned models and isolated runtime
        run: bash scripts/fetch_models.sh
      - name: Compile app, unit tests, instrumented tests
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest -Dorg.gradle.jvmargs="-Xmx3g"
      - name: Verify packaged offline analysis model
        run: |
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/models/dpdfnet2.onnx > /tmp/packaged-dpdfnet2.onnx
          echo 'ce35d6025fc71df0ef10d1540e1b7916837bbfe5f6896deb744508d2cad487a9  /tmp/packaged-dpdfnet2.onnx' | sha256sum -c -
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Keep phone APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-footage-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
      - name: Offline native extraction and UI
        uses: reactivecircus/android-emulator-runner@v2
        env:
          VB_EMULATOR: '1'
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            trap 'adb pull /sdcard/Android/data/com.akashrajeev.voicebeam.finale/files/offset-evidence offset-evidence || true; adb logcat -d -s OffsetEvidence:I > offset-evidence-log.txt || true' EXIT
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.akashrajeev.voicebeam.OfflineExtractorTest,com.akashrajeev.voicebeam.OfflineImportUiTest,com.akashrajeev.voicebeam.OfflineVideoRoundTripTest,com.akashrajeev.voicebeam.FootageImportRoundTripTest#importPreservesOriginalAndExportsSynchronizedVideo,com.akashrajeev.voicebeam.FootageImportRoundTripTest#cancelBeforeExtractionDoesNotWriteOutput -Dorg.gradle.jvmargs="-Xmx3g"
            adb logcat -d -s OfflineGuard:I TseTest:I FootageNative:I OfflineFootageGuard:I > offline-extractor-log.txt
            cat offline-extractor-log.txt
            ./gradlew --no-daemon installDebug installDebugAndroidTest -Dorg.gradle.jvmargs="-Xmx3g"
            adb shell am instrument -w -e class com.akashrajeev.voicebeam.OfflineImportUiTest com.akashrajeev.voicebeam.finale.test/androidx.test.runner.AndroidJUnitRunner | tee offline-ui-instrument.txt
            grep -q '^OK (2 tests)' offline-ui-instrument.txt
            adb logcat -d -s TseTest:I > offline-extractor-log.txt
            adb pull /sdcard/Android/data/com.akashrajeev.voicebeam.finale/files/offline-custom-video.png ci-offline-ui.png
      - name: Restore phone APK
        run: ./gradlew --no-daemon assembleDebug -Dorg.gradle.jvmargs="-Xmx3g"
      - name: Keep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: footage-native-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/debug/app-debug.apk
            ci-offline-ui.png
            offline-extractor-log.txt
            offset-evidence/
            offset-evidence-log.txt
          retention-days: 1
