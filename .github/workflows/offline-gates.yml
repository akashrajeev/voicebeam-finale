name: Offline video candidate gates
on:
  push:
    branches: [experiment-10]
    paths: ['.github/workflows/offline-gates.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch pinned models and isolated runtime
        run: bash scripts/fetch_models.sh
      - name: Compile app, unit tests, instrumented tests
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest -Dorg.gradle.jvmargs="-Xmx3g"
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Keep phone APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-offline-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
      - name: Offline native extraction and UI
        uses: reactivecircus/android-emulator-runner@v2
        env:
          VB_EMULATOR: '1'
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.akashrajeev.voicebeam.OfflineExtractorTest,com.akashrajeev.voicebeam.OfflineImportUiTest -Dorg.gradle.jvmargs="-Xmx3g"
            adb pull /sdcard/Android/data/com.akashrajeev.voicebeam.lab/files/offline-custom-video.png ci-offline-ui.png || true
      - name: Keep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-gates-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/debug/app-debug.apk
            ci-offline-ui.png
          retention-days: 1
